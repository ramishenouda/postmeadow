# Production stack. Lives in /opt/postmeadow on the server next to Caddyfile and .env.
# Works the same on any Linux VPS with Docker (Hostinger today, Hetzner later).
#
#   docker compose pull                 # get the image built by GitHub Actions
#   docker compose run --rm migrate     # apply database migrations
#   docker compose up -d                # start or update everything

name: postmeadow

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/ramishenouda/postmeadow:latest}
  env_file: .env
  environment:
    # Composed here so the database password is only set once, in .env.
    DATABASE_URL: postgres://postmeadow:${POSTGRES_PASSWORD}@postgres:5432/postmeadow
    STORAGE_DIR: /data/storage
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *app
    restart: unless-stopped
    volumes:
      - storage:/data/storage
    # Let in-flight requests and background sends finish on deploys and restarts.
    stop_grace_period: 60s
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  migrate:
    <<: *app
    command: ["node", "migrate.mjs"]
    restart: "no"
    profiles: ["tools"] # only runs when asked: docker compose run --rm migrate

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postmeadow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postmeadow
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postmeadow"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
    # Not published: only reachable from the other containers.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # HTTPS certificates
      - caddy_config:/config
    depends_on: [app]
    logging: *logging

  backup:
    # Nightly database dump into ./backups (14 days), plus an encrypted off-site copy of
    # the dumps and uploaded images when BACKUP_S3_* is set. See deploy/backup/backup.sh.
    build: ./backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: postmeadow
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postmeadow
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    volumes:
      - ./backups:/backups
      - storage:/data/storage:ro
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
